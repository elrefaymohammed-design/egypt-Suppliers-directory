<title>Egypt Supplier Directory</title>

<style>
/* Layout: a working directory — status strip, search, filter bar, then supplier rows grouped by category; rows collapse to cards on phones. Bilingual: Arabic (RTL) default, English toggle. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #16201e;
  --muted: #5b6a66;
  --line: #d9e0dd;
  --accent: #0d6b5f;
  --accent-soft: #e0f0ec;
  --ok: #1f7a3a;
  --ok-soft: #e3f3e7;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --none: #7a7f86;
  --none-soft: #eceef0;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root[lang="ar"] {
  --f-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #17201e; --ink: #e5ece9; --muted: #95a6a1; --line: #2a3633;
  --accent: #4cc1ae; --accent-soft: #163631; --ok: #6fd08a; --ok-soft: #173322;
  --warn: #f0b860; --warn-soft: #3a2b12; --none: #a3a9b0; --none-soft: #252b2d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #17201e; --ink: #e5ece9; --muted: #95a6a1; --line: #2a3633;
  --accent: #4cc1ae; --accent-soft: #163631; --ok: #6fd08a; --ok-soft: #173322;
  --warn: #f0b860; --warn-soft: #3a2b12; --none: #a3a9b0; --none-soft: #252b2d; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 22px; }
h1 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 65ch; }
.head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.headside { display: grid; gap: 8px; justify-items: end; }
.fresh { font-size: 13px; color: var(--muted); display: grid; gap: 2px; text-align: end; }
.fresh strong { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-inline-end: 6px; vertical-align: 1px; }
.dot.stale { background: var(--warn); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--f-body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.strip > div { background: var(--surface); padding: 12px 14px; }
.strip b { display: block; font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.strip span { font-size: 12px; color: var(--muted); }
:root[lang="en"] .strip span { text-transform: uppercase; letter-spacing: .06em; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 14px var(--f-body); padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
select { font: 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; }
.searchbox { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding-block: 4px; padding-inline: 14px 6px; color: var(--accent); }
.searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox svg { flex: none; }
.searchbox input { flex: 1; border: 0; background: transparent; color: var(--ink); font: 16px var(--f-body); padding: 10px 0; outline: none; min-width: 0; }
.searchbox .clear { font: 500 13px var(--f-body); border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.group { display: grid; gap: 8px; }
.group h2 { font-family: var(--f-display); font-size: 18px; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.group h2 small { font: 500 12px var(--f-body); color: var(--muted); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.5fr) minmax(0, 1.6fr) minmax(0, 2fr); gap: 16px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row > div { min-width: 0; }
.name { font-weight: 600; }
.alt { font-size: 12px; color: var(--muted); }
.sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.k { font-size: 11px; color: var(--muted); display: none; }
.type { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }
.phone { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; direction: ltr; justify-content: flex-end; }
:root[lang="en"] .phone { justify-content: flex-start; }
.copy { font: 500 12px var(--f-body); border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; margin-top: 4px; }
.pill.official { background: var(--ok-soft); color: var(--ok); }
.pill.directory { background: var(--warn-soft); color: var(--warn); }
.pill.missing { background: var(--none-soft); color: var(--none); }
a { color: var(--accent); }
.ltr { direction: ltr; unicode-bidi: isolate; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; color: var(--muted); }
.partners { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.k2 { font-size: 11px; color: var(--muted); margin-inline-end: 2px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
.br { grid-column: 1 / -1; font-size: 14px; }
.br summary { cursor: pointer; color: var(--accent); font-weight: 600; width: max-content; }
.br ul { margin: 8px 0 0; padding: 10px 14px; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 20px; background: var(--bg); border-radius: 8px; }
.br li { min-width: 0; overflow-wrap: anywhere; }
.br .phone { display: inline-flex; margin-inline-start: 4px; }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.printbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font: 600 13px var(--f-body); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.printbtn:hover { border-color: var(--accent); }
.printgrp { display: flex; flex-wrap: wrap; gap: 6px; }
[hidden] { display: none !important; }
.siterow { margin: 4px 0 2px; }
.fhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.ctry { font-size: 12.5px; color: var(--muted); }
.eglist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.eglist li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.eglink { border: 0; background: none; padding: 0; color: var(--accent); font: 600 13.5px var(--f-body); cursor: pointer; text-align: start; text-decoration: underline; text-underline-offset: 3px; }
.role { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.sitebtn { display: inline-flex; align-items: center; gap: 4px; font: 600 12.5px var(--f-body); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 11px; text-decoration: none; }
.sitebtn:hover { filter: brightness(1.05); text-decoration: underline; }
.sitebtn.ghost { background: transparent; border-style: dashed; color: var(--muted); border-color: var(--line); font-weight: 500; }
.makes { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
.makes b { color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 15px var(--f-body); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 12px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.mcard h3 { font-family: var(--f-display); font-size: 17px; margin: 0; }
.mcard .proc { font-size: 13px; color: var(--muted); }
.mcard .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.mcard .chip { background: var(--bg); }
.mcard .find { justify-self: start; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 600 13px var(--f-body); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.printmsg { font-size: 12px; color: var(--muted); }
.byline { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.byline strong { color: var(--accent); font-weight: 600; }
.sign { border-top: 1px solid var(--line); padding-top: 14px; font-size: 14px; color: var(--muted); }
.sign strong { color: var(--ink); font-family: var(--f-display); font-size: 16px; }

@media (max-width: 760px) {
  .row { grid-template-columns: 1fr; gap: 8px; }
  .k { display: block; }
  .fresh { text-align: start; }
  .headside { justify-items: start; }
  .phone, :root[lang="en"] .phone { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>[hidden]{display:none!important}</style>
</head>

  <p class="note" id="note"></p>

</div>

      contact: "Contact", phone: "Phone", address: "Address", general: "General line",
      st: { official: "Official", directory: "Directory", missing: "Not found yet" },
      copy: "Copy", copied: "Copied", selected: "Selected",
      dealers: "Dealers / agents", partnersOf: "Partner mills & brands",
      branches: n => `${n} branch${n > 1 ? "es" : ""}`,
      none: 'No suppliers match these filters. Clear the search or pick "All categories".',
      emptyDb: "No suppliers stored yet. They appear here as soon as the directory is filled, and the daily refresh adds more.",
      signin: "The supplier list loads for signed-in viewers. Open this page from claude.ai to see it.",
      failed: "The directory could not be loaded right now. Reload the page to try again.",
      source: "Source", cairo: "Cairo",
      note: '<b>Phone status:</b> <span class="pill official">Official</span> taken from the company\'s own site or filings · <span class="pill directory">Directory</span> from a business directory or press listing, worth a confirming call · <span class="pill missing">Not found yet</span> the daily refresh keeps looking. Hotlines (5-digit numbers starting 15/16/19) only work from inside Egypt.',
    },
  };

  let lang = "ar";
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ar") lang = s; } catch (e) {}
  const state = { tab: "sup", frn: [], rows: [], meta: null, sector: "all", cat: "all", typ: "all", q: "", hasPhone: false, loaded: false, error: "" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const t = () => T[lang];
  const ar = () => lang === "ar";
  const secName = (s) => { const x = SECTORS.find(r => r[0] === s); return x ? (ar() ? x[1] : x[0]) : s; };
  const catName = (c) => ar() ? (CATS[c] || c) : c;
  const typeName = (ty) => ar() ? (TYPES[ty] || ty) : ty;
  const f = (r, k) => ar() ? (r[k + "Ar"] || r[k] || "") : (r[k] || "");

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || "";
    return d.toLocaleString(ar() ? "ar-EG" : "en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Africa/Cairo" }) + " " + t().cairo;
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dir = ar() ? "rtl" : "ltr";
    $("title").textContent = t().title;
    $("lede").textContent = t().lede;
    $("byline").innerHTML = `${esc(t().prepared)} <strong>${esc(t().signer)}</strong>`;
    $("signLbl").textContent = t().prepared;
    $("signName").textContent = t().signer;
    $("printLbl").textContent = t().print;
    $("printAllLbl").textContent = t().printAll;
    $("q").placeholder = t().search;
    $("q").setAttribute("aria-label", t().search);
    $("qClear").textContent = t().clear;
    $("hasPhoneLbl").textContent = t().hasPhone;
    $("note").innerHTML = t().note;
    $("tabSup").textContent = t().tabSup;
    $("tabMat").textContent = t().tabMat;
    $("tabFrn").textContent = t().tabFrn;
    $("frnIntro").textContent = t().frnIntro;
    $("frn").hidden = state.tab !== "frn";
    ["cat", "typ"].forEach(id => { $(id).hidden = state.tab !== "sup"; });
    document.querySelector(".bar .chk").hidden = state.tab !== "sup";
    $("matIntro").textContent = t().matIntro;
    $("tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    document.querySelector(".bar").hidden = state.tab === "mat";
    $("list").hidden = state.tab !== "sup";
    $("mats").hidden = state.tab !== "mat";
    $("langSeg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
    $("sectorSeg").innerHTML = `<button type="button" data-v="all" aria-pressed="${state.sector === "all"}">${esc(t().allSectors)}</button>` +
      SECTORS.map(s => `<button type="button" data-v="${esc(s[0])}" aria-pressed="${state.sector === s[0]}">${esc(ar() ? s[1] : s[2])}</button>`).join("");
    $("typ").innerHTML = `<option value="all">${esc(t().allTypes)}</option>` +
      Object.keys(TYPES).map(k => `<option value="${esc(k)}"${state.typ === k ? " selected" : ""}>${esc(typeName(k))}</option>`).join("");
  }

  function renderFresh() {
    const m = state.meta;
    if (state.error) { $("fresh").innerHTML = `<span><span class="dot stale"></span>${esc(state.error)}</span>`; return; }
    if (!state.loaded) { $("fresh").innerHTML = `<span><span class="dot stale"></span>${esc(t().connecting)}</span>`; return; }
    if (!m) { $("fresh").innerHTML = `<span><span class="dot stale"></span>${esc(t().waiting)}</span>`; return; }
    const age = (Date.now() - new Date(m.lastRun).getTime()) / 36e5;
    const summary = ar() ? (m.summaryAr || "") : (m.summary || "");
    $("fresh").innerHTML = `<span><span class="dot ${age > 30 ? "stale" : ""}"></span>${esc(t().refreshed)} <strong>${esc(fmtDate(m.lastRun))}</strong></span>` + (summary ? `<span>${esc(summary)}</span>` : "");
  }

  function renderStrip() {
    const r = state.rows;
    const n = (fn) => r.filter(fn).length;
    const items = [[r.length, t().suppliers]]
      .concat(SECTORS.map(s => [n(x => x.sector === s[0]), ar() ? s[1] : s[2]]))
      .concat([[state.frn.length, t().frnCount], [n(x => x.phoneStatus === "official"), t().official], [n(x => x.phoneStatus === "missing"), t().toFind]]);
    $("strip").innerHTML = items.map(([v, l]) => `<div><b>${v.toLocaleString(ar() ? "ar-EG" : "en-GB")}</b><span>${esc(l)}</span></div>`).join("");
  }

  function renderCats() {
    const cats = [...new Set(state.rows.filter(r => state.sector === "all" || r.sector === state.sector).map(r => r.category))]
      .sort((a, b) => catName(a).localeCompare(catName(b), lang));
    if (!cats.includes(state.cat)) state.cat = "all";
    $("cat").innerHTML = `<option value="all">${esc(t().allCats)}</option>` + cats.map(c => `<option value="${esc(c)}"${c === state.cat ? " selected" : ""}>${esc(catName(c))}</option>`).join("");
  }

  const phoneSpan = (p) => `<span class="phone"><span>${esc(p)}</span><button type="button" class="copy" data-copy="${esc(p.replace(/\s*\(.*\)$/, ""))}">${esc(t().copy)}</button></span>`;

  function branchHtml(r) {
    const b = (r.branches || []).filter(x => x && (x.address || x.city));
    if (!b.length) return "";
    const q = state.q.trim().toLowerCase();
    const open = q && b.some(x => [x.city, x.cityAr, x.address, x.addressAr, x.name, x.nameAr].join(" ").toLowerCase().includes(q));
    return `<details class="br"${open ? " open" : ""}><summary>${esc(t().branches(b.length))}</summary><ul>` +
      b.map(x => `<li><b>${esc(f(x, "city"))}</b>${f(x, "name") ? " · " + esc(f(x, "name")) : ""}<span class="sub"> ${esc(f(x, "address"))}</span>${x.phone ? " " + phoneSpan(x.phone) : ""}</li>`).join("") + "</ul></details>";
  }

  function rowHtml(r) {
    const status = r.phoneStatus || "missing";
    const phones = (r.phones || []).filter(Boolean);
    const phoneHtml = phones.length ? phones.map(phoneSpan).join("") : '<span class="sub">—</span>';
    const web = "";
    const site = r.website
      ? `<a class="sitebtn" href="${esc(/^https?:/.test(r.website) ? r.website : "https://" + r.website)}" target="_blank" rel="noopener noreferrer" title="${esc(r.website)}">${esc(t().site)} <span aria-hidden="true">↗</span></a>`
      : `<a class="sitebtn ghost" href="https://www.google.com/search?q=${encodeURIComponent(r.company + " Egypt official website")}" target="_blank" rel="noopener noreferrer">${esc(t().findSite)} <span aria-hidden="true">↗</span></a>`;
    const src = r.sourceUrl ? `<a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">${esc(t().source)}: ${esc(r.source || "")}</a>` : esc(r.source || "");
    const name = f(r, "company");
    const altName = ar() && r.companyAr && r.companyAr !== r.company ? `<div class="alt ltr">${esc(r.company)}</div>` : "";
    const partners = (r.partners || []).filter(Boolean);
    return `<div class="row">
      <div><div class="name">${esc(name)}</div>${altName}<div class="siterow">${site}</div><div class="sub">${esc(f(r, "items"))}</div><span class="type">${esc(typeName(r.type))}</span>${partners.length ? `<div class="partners"><span class="k2">${esc(r.type === "Manufacturer" ? t().dealers : t().partnersOf)}</span> ${partners.map(p => `<span class="chip">${esc(p)}</span>`).join("")}</div>` : ""}</div>
      <div><span class="k">${esc(t().contact)}</span>${f(r, "contact") ? `<div>${esc(f(r, "contact"))}</div>` : `<div class="sub">${esc(t().general)}</div>`}${r.email ? `<div class="sub ltr">${esc(r.email)}</div>` : ""}</div>
      <div><span class="k">${esc(t().phone)}</span>${phoneHtml}<span class="pill ${esc(status)}">${esc(t().st[status] || status)}</span></div>
      <div><span class="k">${esc(t().address)}</span><div class="sub">${esc(f(r, "address"))}</div><div class="sub">${web}${web && src ? " · " : ""}${src}</div></div>
      ${branchHtml(r)}
    </div>`;
  }

  function hay(r) {
    return [r.company, r.companyAr, r.contact, r.contactAr, r.address, r.addressAr, r.items, r.itemsAr, r.category, CATS[r.category], r.sector, secName(r.sector), r.email,
      ...(r.partners || []), ...(r.branches || []).map(x => [x.city, x.cityAr, x.name, x.nameAr, x.address, x.addressAr].join(" ")),
      ...matsOf(r.category).flatMap(m => [m.en, m.ar, ...m.mEn, ...m.mAr])].join(" ").toLowerCase();
  }
  const matHay = (m) => [m.en, m.ar, m.pEn, m.pAr, ...m.mEn, ...m.mAr, ...m.cats, ...m.cats.map(c => CATS[c] || "")].join(" ").toLowerCase();
  const currentMats = () => { const q = state.q.trim().toLowerCase(); return MATS.filter(m => !q || matHay(m).includes(q)); };
  const matCount = (m) => state.rows.filter(r => m.cats.includes(r.category)).length;

  function renderMats() {
    const ms = currentMats();
    if (!ms.length) { $("mgrid").innerHTML = `<div class="empty">${esc(t().matNone)}</div>`; return; }
    $("mgrid").innerHTML = ms.map(m => {
      const i = MATS.indexOf(m), n = matCount(m);
      const items = ar() ? m.mAr : m.mEn;
      return `<article class="mcard"><h3>${esc(ar() ? m.ar : m.en)}</h3><div class="proc"><b>${esc(t().process)}:</b> ${esc(ar() ? m.pAr : m.pEn)}</div><span class="k">${esc(t().products)}</span><div class="chips">${items.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>${n ? `<button type="button" class="find" data-m="${i}">${esc(t().showSup(n))}</button>` : ""}</article>`;
    }).join("");
  }

  const roleName = (r) => t().roles[r] || r;
  const supName = (p) => { const s = state.rows.find(r => r.id === p.id); return s ? f(s, "company") : (ar() ? (p.nameAr || p.name) : p.name) || p.id || ""; };
  const frnHay = (x) => [x.company, x.companyAr, x.country, x.countryAr, x.products, x.productsAr, x.sector, secName(x.sector), x.category, CATS[x.category], x.website,
    ...(x.egypt || []).map(p => { const s = state.rows.find(r => r.id === p.id); return [p.name, p.nameAr, s && s.company, s && s.companyAr, p.role, t().roles[p.role]].join(" "); })].join(" ").toLowerCase();
  function currentFrn() {
    const q = state.q.trim().toLowerCase(), order = SECTORS.map(s => s[0]);
    return state.frn.filter(x => (state.sector === "all" || x.sector === state.sector) && (!q || frnHay(x).includes(q)))
      .sort((a, b) => (order.indexOf(a.sector) - order.indexOf(b.sector)) || f(a, "company").localeCompare(f(b, "company"), lang));
  }
  function renderFrn() {
    if (!state.loaded) { $("fgrid").innerHTML = `<div class="empty">${esc(state.error || t().frnEmpty)}</div>`; return; }
    const xs = currentFrn();
    if (!xs.length) { $("fgrid").innerHTML = `<div class="empty">${esc(t().frnNone)}</div>`; return; }
    $("fgrid").innerHTML = xs.map(x => {
      const url = x.website ? (/^https?:/.test(x.website) ? x.website : "https://" + x.website) : "";
      const eg = (x.egypt || []).map(p => `<li>${p.id && state.rows.some(r => r.id === p.id) ? `<button type="button" class="eglink" data-id="${esc(p.id)}">${esc(supName(p))}</button>` : `<span>${esc(supName(p))}</span>`}<span class="role">${esc(roleName(p.role))}</span></li>`).join("");
      return `<article class="mcard"><div class="fhead"><h3>${esc(f(x, "company"))}</h3><span class="ctry">${esc(f(x, "country"))}</span></div>${ar() && x.companyAr && x.companyAr !== x.company ? `<div class="alt ltr">${esc(x.company)}</div>` : ""}<div><span class="chip">${esc(secName(x.sector))}</span> <span class="chip">${esc(catName(x.category))}</span></div><div class="proc">${esc(f(x, "products"))}</div>${url ? `<div><a class="sitebtn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(t().site)} <span aria-hidden="true">↗</span></a></div>` : ""}${eg ? `<span class="k">${esc(t().egPartners)}</span><ul class="eglist">${eg}</ul>` : ""}</article>`;
    }).join("");
  }
  function frnPrintDoc(all) {
    const order = SECTORS.map(s => s[0]);
    const xs = all ? state.frn.slice().sort((a, b) => (order.indexOf(a.sector) - order.indexOf(b.sector)) || f(a, "company").localeCompare(f(b, "company"), lang)) : currentFrn();
    const d = new Date().toLocaleString(ar() ? "ar-EG" : "en-GB", { dateStyle: "long", timeStyle: "short", timeZone: "Africa/Cairo" });
    const body = xs.map(x => `<tr><td><b>${esc(f(x, "company"))}</b><br><small>${esc(secName(x.sector))} · ${esc(catName(x.category))}</small></td><td>${esc(f(x, "country"))}</td><td>${esc(f(x, "products"))}${x.website ? `<br><span dir="ltr">${esc(x.website)}</span>` : ""}</td><td>${(x.egypt || []).map(p => esc(supName(p)) + " <small>(" + esc(roleName(p.role)) + ")</small>").join("<br>")}</td></tr>`).join("");
    return `<!doctype html><html lang="${lang}" dir="${ar() ? "rtl" : "ltr"}"><head><meta charset="utf-8"><title>${esc(t().frnTitle)}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#16201e;font-size:12px;margin:0}h1{font-size:20px;margin:0 0 4px}.meta{color:#5b6a66;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #c9d2cf;padding:6px;vertical-align:top;text-align:start}th{background:#e0f0ec}small{color:#5b6a66}tr{break-inside:avoid}.sign{margin-top:14px;border-top:1px solid #c9d2cf;padding-top:8px;font-size:13px}</style></head><body><h1>${esc(t().frnTitle)}</h1><p class="meta">${esc(t().prepared)} <b>${esc(t().signer)}</b> · ${esc(t().printed)}: ${esc(d)} · ${esc(t().frnCount)}: ${xs.length}</p><table><thead><tr><th>${esc(t().company)}</th><th>${esc(t().country)}</th><th>${esc(t().products)}</th><th>${esc(t().egPartners)}</th></tr></thead><tbody>${body}</tbody></table><p class="sign">${esc(t().prepared)} <b>${esc(t().signer)}</b></p><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)});<\/script></body></html>`;
  }

  function matPrintDoc(all) {
    const ms = all ? MATS : currentMats();
    const d = new Date().toLocaleString(ar() ? "ar-EG" : "en-GB", { dateStyle: "long", timeStyle: "short", timeZone: "Africa/Cairo" });
    const body = ms.map(m => `<tr><td><b>${esc(ar() ? m.ar : m.en)}</b><br><small>${esc(m.cats.map(catName).join(" · "))}</small></td><td>${esc(ar() ? m.pAr : m.pEn)}</td><td>${esc((ar() ? m.mAr : m.mEn).join("، "))}</td><td>${matCount(m)}</td></tr>`).join("");
    return `<!doctype html><html lang="${lang}" dir="${ar() ? "rtl" : "ltr"}"><head><meta charset="utf-8"><title>${esc(t().matTitle)}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#16201e;font-size:12px;margin:0}h1{font-size:20px;margin:0 0 4px}.meta{color:#5b6a66;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #c9d2cf;padding:6px;vertical-align:top;text-align:start}th{background:#e0f0ec}small{color:#5b6a66}tr{break-inside:avoid}.sign{margin-top:14px;border-top:1px solid #c9d2cf;padding-top:8px;font-size:13px}</style></head><body><h1>${esc(t().matTitle)}</h1><p class="meta">${esc(t().prepared)} <b>${esc(t().signer)}</b> · ${esc(t().printed)}: ${esc(d)}${!all && state.q ? " · «" + esc(state.q) + "»" : ""}</p><table><thead><tr><th>${esc(t().material)}</th><th>${esc(t().process)}</th><th>${esc(t().products)}</th><th>${esc(t().count)}</th></tr></thead><tbody>${body}</tbody></table><p class="sign">${esc(t().prepared)} <b>${esc(t().signer)}</b></p><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)});<\/script></body></html>`;
  }

  function currentRows() {
    const q = state.q.trim().toLowerCase();
    return state.rows.filter(r =>
      (state.sector === "all" || r.sector === state.sector) &&
      (state.cat === "all" || r.category === state.cat) &&
      (state.typ === "all" || r.type === state.typ) &&
      (!state.hasPhone || (r.phones || []).some(Boolean)) &&
      (!q || hay(r).includes(q)));
  }

  function printDoc(all) {
    if (state.tab === "mat") return matPrintDoc(all);
    if (state.tab === "frn") return frnPrintDoc(all);
    const order = SECTORS.map(s => s[0]);
    const rows = (all ? state.rows.slice() : currentRows()).sort((a, b) => (order.indexOf(a.sector) - order.indexOf(b.sector)) || catName(a.category).localeCompare(catName(b.category), lang) || f(a, "company").localeCompare(f(b, "company"), lang));
    const d = new Date().toLocaleString(ar() ? "ar-EG" : "en-GB", { dateStyle: "long", timeStyle: "short", timeZone: "Africa/Cairo" });
    const filters = all ? "" : [state.sector !== "all" ? secName(state.sector) : "", state.cat !== "all" ? catName(state.cat) : "", state.typ !== "all" ? typeName(state.typ) : "", state.q ? "«" + state.q + "»" : ""].filter(Boolean).join(" · ");
    let lastCat = "";
    const body = rows.map(r => {
      const cat = r.sector + "|" + r.category;
      const head = cat !== lastCat ? `<tr class="cat"><td colspan="5">${esc(catName(r.category))} — ${esc(secName(r.sector))}</td></tr>` : "";
      lastCat = cat;
      const br = (r.branches || []).filter(x => x && (x.address || x.city)).map(x => esc([f(x, "city"), f(x, "name"), f(x, "address"), x.phone].filter(Boolean).join(" – "))).join("<br>");
      return head + `<tr><td><b>${esc(f(r, "company"))}</b><br><small>${esc(typeName(r.type))}</small><br><small>${esc(f(r, "items"))}</small>${(r.partners || []).length ? `<br><small>${esc((r.partners || []).join("، "))}</small>` : ""}</td><td>${esc(f(r, "contact"))}${r.email ? `<br><span dir="ltr">${esc(r.email)}</span>` : ""}</td><td dir="ltr">${(r.phones || []).map(esc).join("<br>") || "—"}<br><small>${esc(t().st[r.phoneStatus || "missing"])}</small></td><td>${esc(f(r, "address"))}${r.website ? `<br><span dir="ltr">${esc(r.website)}</span>` : ""}</td><td><small>${br}</small></td></tr>`;
    }).join("");
    return `<!doctype html><html lang="${lang}" dir="${ar() ? "rtl" : "ltr"}"><head><meta charset="utf-8"><title>${esc(t().title)}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#16201e;font-size:11px;margin:0}h1{font-size:20px;margin:0 0 4px}.meta{color:#5b6a66;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #c9d2cf;padding:5px 6px;vertical-align:top;text-align:start}th{background:#e0f0ec}tr.cat td{background:#0d6b5f;color:#fff;font-weight:700;font-size:12px}small{color:#5b6a66}tr{break-inside:avoid}.sign{margin-top:14px;border-top:1px solid #c9d2cf;padding-top:8px;font-size:13px}</style></head><body><h1>${esc(t().title)}</h1><p class="meta">${esc(t().prepared)} <b>${esc(t().signer)}</b> · ${esc(t().printed)}: ${esc(d)} · ${esc(t().count)}: ${rows.length}${filters ? " · " + esc(filters) : ""}</p><table><thead><tr><th>${esc(t().company)}</th><th>${esc(t().contact)}</th><th>${esc(t().phone)}</th><th>${esc(t().address)}</th><th>${esc(t().branchesH)}</th></tr></thead><tbody>${body}</tbody></table><p class="sign">${esc(t().prepared)} <b>${esc(t().signer)}</b></p><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)});<\/script></body></html>`;
  }

  function renderList() {
    renderMats(); renderFrn();
    if (state.error) { $("list").innerHTML = `<div class="empty">${esc(state.error)}</div>`; return; }
    if (!state.loaded) { $("list").innerHTML = `<div class="empty">${esc(t().loading)}</div>`; return; }
    const q = state.q.trim().toLowerCase();
    const rows = state.rows.filter(r =>
      (state.sector === "all" || r.sector === state.sector) &&
      (state.cat === "all" || r.category === state.cat) &&
      (state.typ === "all" || r.type === state.typ) &&
      (!state.hasPhone || (r.phones || []).some(Boolean)) &&
      (!q || hay(r).includes(q)));
    if (!state.rows.length) { $("list").innerHTML = `<div class="empty">${esc(t().emptyDb)}</div>`; return; }
    if (!rows.length) { $("list").innerHTML = `<div class="empty">${esc(t().none)}</div>`; return; }
    const order = SECTORS.map(s => s[0]);
    const groups = {};
    rows.forEach(r => { const k = r.sector + "\u0000" + r.category; (groups[k] ||= []).push(r); });
    const keys = Object.keys(groups).sort((a, b) => {
      const [sa, ca] = a.split("\u0000"), [sb, cb] = b.split("\u0000");
      return (order.indexOf(sa) - order.indexOf(sb)) || catName(ca).localeCompare(catName(cb), lang);
    });
    $("list").innerHTML = '<div style="display:grid;gap:22px">' + keys.map(k => {
      const g = groups[k].sort((a, b) => f(a, "company").localeCompare(f(b, "company"), lang));
      const mk = [...new Set(matsOf(g[0].category).flatMap(m => ar() ? m.mAr : m.mEn))].slice(0, 8);
      return `<section class="group"><h2>${esc(catName(g[0].category))} <small>${esc(secName(g[0].sector))} · ${g.length.toLocaleString(ar() ? "ar-EG" : "en-GB")}</small></h2>${mk.length ? `<p class="makes"><b>${esc(t().makes)}</b> ${esc(mk.join(ar() ? "، " : ", "))}</p>` : ""}<div class="rows">${g.map(rowHtml).join("")}</div></section>`;
    }).join("") + "</div>";
  }

  function renderAll() { applyStatic(); renderFresh(); renderStrip(); renderCats(); renderList(); }

  $("langSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.l === lang) return;
    lang = b.dataset.l;
    try { localStorage.setItem("lang", lang); } catch (err) {}
    renderAll();
  });
  $("sectorSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.sector = b.dataset.v;
    $("sectorSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderCats(); renderList();
  });
  $("cat").addEventListener("change", e => { state.cat = e.target.value; renderList(); });
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.tab === state.tab) return;
    state.tab = b.dataset.tab; applyStatic(); renderCats(); renderList();
  });
  $("mgrid").addEventListener("click", e => {
    const b = e.target.closest(".find"); if (!b) return;
    const m = MATS[+b.dataset.m];
    state.tab = "sup"; state.sector = "all"; state.typ = "all"; state.q = ""; $("q").value = ""; $("qClear").hidden = true;
    applyStatic(); renderCats();
    const have = m.cats.find(c => state.rows.some(r => r.category === c));
    state.cat = have || "all"; $("cat").value = state.cat;
    renderList(); $("tabs").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("typ").addEventListener("change", e => { state.typ = e.target.value; renderList(); });
  $("fgrid").addEventListener("click", e => {
    const b = e.target.closest(".eglink"); if (!b) return;
    const s = state.rows.find(r => r.id === b.dataset.id); if (!s) return;
    state.tab = "sup"; state.sector = "all"; state.cat = "all"; state.typ = "all"; state.q = s.company; $("q").value = s.company; $("qClear").hidden = false;
    applyStatic(); renderCats(); renderList(); $("tabs").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("q").addEventListener("input", e => { state.q = e.target.value; $("qClear").hidden = !state.q; renderList(); });
  $("qClear").addEventListener("click", () => { $("q").value = ""; state.q = ""; $("qClear").hidden = true; renderList(); $("q").focus(); });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
  $("hasPhone").addEventListener("change", e => { state.hasPhone = e.target.checked; renderList(); });
  $("list").addEventListener("click", async e => {
    const b = e.target.closest(".copy"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = t().copied; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = t().selected; }
    setTimeout(() => { b.textContent = t().copy; }, 1500);
  });

  renderAll();

  (async () => {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) return;
    $("printGrp").hidden = false;
    const doPrint = async (all) => {
      $("printMsg").textContent = t().printing;
      try {
        await dl.save({ filename: (ar() ? "دليل-الموردين" : "egypt-suppliers") + (all ? "-all" : "-results") + ".html", data: printDoc(all) });
        $("printMsg").textContent = t().printSaved;
      } catch (err) {
        $("printMsg").textContent = err && err.code === "declined" ? "" : t().printFail;
      }
    };
    $("printAll").addEventListener("click", () => doPrint(true));
    $("printBtn").addEventListener("click", () => doPrint(false));
  })();

  let live = false, snapOk = false;
  const snapP = fetch("snapshot.json").then(r => r.ok ? r.json() : null).then(s => {
    if (!s || live) return;
    snapOk = true; state.snap = s.savedAt;
    state.rows = (s.suppliers || []).filter(r => r.company);
    state.frn = (s.foreign || []).filter(x => x.company);
    state.meta = s.meta || null; state.loaded = true; state.error = "";
    renderFresh(); renderStrip(); renderCats(); renderList();
  }).catch(() => {});

  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { await snapP; if (!snapOk) { state.error = t().signin; renderFresh(); renderList(); } return; }
    db.collection("suppliers").onSnapshot(snap => {
      const rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.company);
      if (!rows.length && snapOk) return;
      live = true; state.snap = ""; state.error = "";
      state.rows = rows;
      state.loaded = true;
      renderFresh(); renderStrip(); renderCats(); renderList();
    }, () => { if (!snapOk) { state.error = t().failed; renderFresh(); renderList(); } });
    db.collection("foreign").onSnapshot(snap => {
      const xs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.company);
      if (!xs.length && snapOk) return;
      state.frn = xs;
      renderStrip(); renderFrn();
    }, () => {});
    db.doc("meta/status").onSnapshot(s => { if (s.exists) { state.meta = s.data(); renderFresh(); } });
  })();
})();
</script>

</body>
</html>
